<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="验证 GreenBox 邮箱。">
  <title>验证邮箱 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center;">
    <div class="auth-brand" style="justify-content:center;"><span class="mark">G</span><span class="name">GreenBox</span></div>
    <h1>验证邮箱</h1>
    <div class="sub" id="sub">正在验证，请稍候...</div>
    <div id="icon" style="font-size:42px;margin:18px 0;">…</div>
    <div class="auth-link" style="margin-top:18px;"><a href="/profile.html">前往个人中心</a> · <a href="/">返回首页</a></div>
  </div>
</div>
<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var sub = document.getElementById('sub');
  var icon = document.getElementById('icon');
  (async function () {
    if (!token) {
      sub.textContent = '验证链接不完整，请重新发送验证邮件。';
      icon.textContent = '!';
      return;
    }
    try {
      var res = await fetch('/api/auth/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || '验证失败');
      sub.textContent = '邮箱已验证，可以返回个人中心使用邮箱找回密码。';
      icon.textContent = '✓';
    } catch (e) {
      sub.textContent = e.message || '验证链接无效或已过期，请重新发送验证邮件。';
      icon.textContent = '!';
    }
  })();
</script>
</body>
</html>
