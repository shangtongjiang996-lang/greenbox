<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="通过绑定邮箱找回 GreenBox 账号密码。">
  <title>忘记密码 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">G</span><span class="name">GreenBox</span></div>
    <h1>忘记密码</h1>
    <div class="sub">输入账号绑定的邮箱，我们会发送重置链接。</div>
    <div class="form-group">
      <label for="email">邮箱</label>
      <input type="email" id="email" placeholder="你绑定并验证过的邮箱" autocomplete="email" maxlength="254">
    </div>
    <button class="btn-primary" id="sendBtn">发送重置邮件</button>
    <div id="msg" class="success-msg" style="display:none;"></div>
    <div id="error" class="error-msg" style="display:none;"></div>
    <div class="auth-link" style="margin-top:18px;">
      <a href="/login.html">返回登录</a>
    </div>
  </div>
</div>
<script>
  var btn = document.getElementById('sendBtn');
  btn.addEventListener('click', async function () {
    var email = document.getElementById('email').value.trim();
    var msg = document.getElementById('msg');
    var errorEl = document.getElementById('error');
    msg.style.display = 'none';
    errorEl.style.display = 'none';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      errorEl.textContent = '请输入正确的邮箱地址';
      errorEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = '发送中...';
    try {
      var res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || '发送失败');
      msg.textContent = data.message || '如果该邮箱已绑定并验证，重置邮件会很快送达。';
      msg.style.display = 'block';
    } catch (e) {
      errorEl.textContent = e.message || '发送失败，请稍后重试';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = '发送重置邮件';
    }
  });
</script>
</body>
</html>
