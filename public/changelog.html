<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>更新日志 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🌱 GreenBox</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="tools.html">工具</a></li>
        <li><a href="changelog.html" class="active">更新日志</a></li>
      </ul>
      <button id="theme-toggle" aria-label="切换主题">🌙</button>
    </div>
  </nav>

  <main class="container">
    <h1>📋 更新日志</h1>
    <div id="changelog-list"></div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 GreenBox · 用心制作</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/data');  // 使用相对路径，指向同域名
        const data = await res.json();
        const container = document.getElementById('changelog-list');
        if (data.changelogs && data.changelogs.length > 0) {
          container.innerHTML = data.changelogs.map(item => `
            <div class="changelog-item">
              <div class="changelog-header">
                <span class="version">${item.version}</span>
                <span class="date">${item.date}</span>
              </div>
              <ul>
                ${item.changes.map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center;padding:3rem 0;color:#94a3b8;">暂无更新记录</p>';
        }
      } catch (err) {
        console.error('加载数据失败:', err);
      }
    })();
  </script>
</body>
</html>
