<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="设置 GreenBox 新密码。">
  <title>重置密码 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="mark">G</span><span class="name">GreenBox</span></div>
    <h1>设置新密码</h1>
    <div class="sub">重置链接只能使用一次，30 分钟内有效。</div>
    <div class="form-group">
      <label for="password">新密码</label>
      <input type="password" id="password" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirm">确认新密码</label>
      <input type="password" id="confirm" placeholder="再次输入" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="resetBtn">保存新密码</button>
    <div id="msg" class="success-msg" style="display:none;"></div>
    <div id="error" class="error-msg" style="display:none;"></div>
    <div class="auth-link" style="margin-top:18px;"><a href="/login.html">返回登录</a></div>
  </div>
</div>
<script>
  var token = new URLSearchParams(location.search).get('token') || '';
  var btn = document.getElementById('resetBtn');
  var errorEl = document.getElementById('error');
  if (!token) {
    errorEl.textContent = '重置链接不完整，请重新申请。';
    errorEl.style.display = 'block';
    btn.disabled = true;
  }
  btn.addEventListener('click', async function () {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    var msg = document.getElementById('msg');
    msg.style.display = 'none';
    errorEl.style.display = 'none';
    if (password.length < 6) { errorEl.textContent = '密码至少 6 位'; errorEl.style.display = 'block'; return; }
    if (password !== confirm) { errorEl.textContent = '两次输入的密码不一致'; errorEl.style.display = 'block'; return; }
    btn.disabled = true;
    btn.textContent = '保存中...';
    try {
      var res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: password })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || '重置失败');
      msg.textContent = '密码已重置，即将跳转到登录页...';
      msg.style.display = 'block';
      setTimeout(function () { location.href = '/login.html'; }, 1400);
    } catch (e) {
      errorEl.textContent = e.message || '重置失败';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '保存新密码';
    }
  });
</script>
</body>
</html>
