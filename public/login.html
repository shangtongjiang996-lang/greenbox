<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
<div class="auth-card">
  <div class="auth-brand"><span class="mark">🌱</span><span class="name">GreenBox</span></div>
  <h1>欢迎回来</h1>
  <div class="sub">登录后管理你的工具箱</div>
  <div class="form-group">
    <label for="username">用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="password">密码</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      <button type="button" class="password-toggle" id="togglePassword" aria-label="显示或隐藏密码">👁️</button>
    </div>
  </div>
  <button class="btn-primary" id="loginBtn">登录</button>
  <div id="loginError" class="error-msg" style="display:none;"></div>
  <div class="auth-link">
    还没有账号？ <a href="/register.html">注册新账号</a>
  </div>
</div>
</div>
<script>
  const API_BASE = '';
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    toggleBtn.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
  });
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    if (!username || !password) {
      errorEl.style.display = 'block';
      errorEl.textContent = '请填写用户名和密码';
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('greenbox_token', data.token);
        localStorage.setItem('greenbox_user', JSON.stringify({ username: data.username, role: data.role }));
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = data.error || '登录失败';
      }
    } catch (err) {
      errorEl.style.display = 'block';
      errorEl.textContent = '网络错误，请稍后重试';
    }
  });
  const token = localStorage.getItem('greenbox_token');
  if (token) {
    fetch(`${API_BASE}/api/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(r => r.json())
    .then(data => {
      if (data.valid) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      }
    });
  }
</script>
</body>
</html>
