<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="登录 GreenBox，管理你的工具、资源和消息。">
  <title>登录 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="auth-wrap">
<div class="auth-card">
  <div class="auth-brand"><span class="mark">G</span><span class="name">GreenBox</span></div>
  <h1>欢迎回来</h1>
  <div class="sub">登录后管理你的工具箱</div>
  <div class="form-group">
    <label for="username">用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="password">密码</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      <button type="button" class="password-toggle" id="togglePassword" aria-label="显示或隐藏密码"><svg class="ico" aria-hidden="true"><use href="/icons.svg#eye"/></svg></button>
    </div>
  </div>
  <div class="form-group" id="twofaGroup" style="display:none;">
    <label for="twofaCode">二次验证码</label>
    <input type="text" id="twofaCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码或恢复码">
  </div>
  <button class="btn-primary" id="loginBtn">登录</button>
  <div id="loginError" class="error-msg" style="display:none;"></div>
  <div style="text-align:right;margin:-6px 0 10px;"><a href="/forgot-password.html" style="font-size:13px;color:var(--muted);text-decoration:none;">忘记密码？</a></div>
  <div class="auth-link">
    还没有账号？ <a href="/register.html">注册新账号</a>
  </div>
</div>
</div>
<script>
  const API_BASE = '';
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    toggleBtn.innerHTML = type === 'password' ? '<svg class="ico" aria-hidden="true"><use href="/icons.svg#eye"/></svg>' : '<svg class="ico" aria-hidden="true"><use href="/icons.svg#eye-off"/></svg>';
  });
  let pendingChallenge = '';
  function finishLogin(data) {
    localStorage.setItem('greenbox_token', data.token);
    localStorage.setItem('greenbox_user', JSON.stringify({ username: data.username, role: data.role }));
    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
    window.location.href = redirect;
  }
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    const twofaGroup = document.getElementById('twofaGroup');
    const twofaCode = document.getElementById('twofaCode');
    if (!pendingChallenge && (!username || !password)) {
      errorEl.style.display = 'block';
      errorEl.textContent = '请填写用户名和密码';
      return;
    }
    if (pendingChallenge && !twofaCode.value.trim()) {
      errorEl.style.display = 'block';
      errorEl.textContent = '请输入二次验证码';
      twofaCode.focus();
      return;
    }
    try {
      const endpoint = pendingChallenge ? `${API_BASE}/api/login/2fa` : `${API_BASE}/api/login`;
      const body = pendingChallenge
        ? { challengeId: pendingChallenge, code: twofaCode.value.trim() }
        : { username, password };
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (data.twoFactorRequired) {
        pendingChallenge = data.challengeId;
        twofaGroup.style.display = 'block';
        document.getElementById('loginBtn').textContent = '验证并登录';
        errorEl.style.display = 'block';
        errorEl.textContent = '请输入身份验证器中的 6 位验证码';
        twofaCode.focus();
        return;
      }
      if (data.success) {
        finishLogin(data);
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = data.error || '登录失败';
      }
    } catch (err) {
      errorEl.style.display = 'block';
      errorEl.textContent = '网络错误，请稍后重试';
    }
  });
  document.getElementById('twofaCode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) document.getElementById('loginBtn').click();
  });
  const token = localStorage.getItem('greenbox_token');
  if (token) {
    fetch(`${API_BASE}/api/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(r => r.json())
    .then(data => {
      if (data.valid) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      }
    });
  }
</script>
</body>
</html>
