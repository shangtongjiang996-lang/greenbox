<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1rem;
    }
    .auth-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 2.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .sub {
      text-align: center;
      color: #64748b;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
      position: relative;
    }
    label {
      display: block;
      font-weight: 500;
      color: #1e293b;
      margin-bottom: 0.3rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      transition: border 0.2s;
      background: white;
    }
    input:focus {
      outline: none;
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 38px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #94a3b8;
    }
    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      /* 统一 margin-top，保证两个页面一致 */
      margin-top: 0.5rem;
    }
    .btn-primary:hover {
      background: #15803d;
    }
    .error-msg {
      color: #ef4444;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      text-align: center;
    }
    .success-msg {
      color: #16a34a;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      text-align: center;
    }
    .auth-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #64748b;
    }
    .auth-link a {
      color: #16a34a;
      text-decoration: none;
      font-weight: 500;
    }
    .auth-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="auth-card">
  <h1>🌱 GreenBox</h1>
  <div class="sub">登录以管理您的工具箱</div>
  <div class="form-group">
    <label for="username">用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-group">
    <label for="password">密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    <button type="button" class="password-toggle" id="togglePassword" aria-label="切换密码可见性">👁️</button>
  </div>
  <button class="btn-primary" id="loginBtn">登录</button>
  <div id="loginError" class="error-msg" style="display:none;"></div>
  <div class="auth-link">
    还没有账号？ <a href="/register.html">立即注册</a>
  </div>
</div>
<script>
  const API_BASE = '';
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  toggleBtn.addEventListener('click', () => {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    toggleBtn.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
  });
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    if (!username || !password) {
      errorEl.style.display = 'block';
      errorEl.textContent = '请填写用户名和密码';
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('greenbox_token', data.token);
        localStorage.setItem('greenbox_user', JSON.stringify({ username: data.username, role: data.role }));
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = data.error || '登录失败';
      }
    } catch (err) {
      errorEl.style.display = 'block';
      errorEl.textContent = '网络错误，请稍后重试';
    }
  });
  const token = localStorage.getItem('greenbox_token');
  if (token) {
    fetch(`${API_BASE}/api/verify`, {
      headers: { 'Authorization': `Bearer ${token}` }
    })
    .then(r => r.json())
    .then(data => {
      if (data.valid) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      }
    });
  }
</script>
</body>
</html>
