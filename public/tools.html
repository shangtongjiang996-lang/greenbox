<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部工具 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 小屏时导航栏不固定，随页面滚动消失 */
    @media (max-width: 900px) {
      .navbar { position: static !important; top: auto !important; }
    }

    /* 用户头像（导航栏） */
    .user-avatar-mini {
      width: 28px; height: 28px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--primary, #16a34a);
      vertical-align: middle; margin-right: 6px;
    }

    /* 通知按钮 + 小红点 */
    .notif-btn {
      position: relative;
      background: var(--bg-alt);
      border: none;
      border-radius: 30px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: all .2s;
      color: var(--text);
    }
    .notif-btn:hover { background: var(--border); transform: translateY(-1px); }
    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5);
      animation: notifBadgePulse 1.8s infinite;
      border: 2px solid var(--bg);
    }
    .notif-badge.show { display: flex; }
    @keyframes notifBadgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* 通知面板 */
    .notif-panel-overlay {
      position: fixed; inset: 0; z-index: 9998;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(3px);
      display: none;
    }
    .notif-panel-overlay.show { display: block; }
    .notif-panel {
      position: fixed;
      top: 70px;
      right: 20px;
      width: 380px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 100px);
      background: var(--card-bg, #fff);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.3),
                  0 0 0 1px rgba(15, 23, 42, 0.06);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 9999;
      animation: notifSlideIn .25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .notif-panel.show { display: flex; }
    @keyframes notifSlideIn {
      from { opacity: 0; transform: translateY(-12px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .notif-header {
      padding: 16px 18px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .notif-header-title {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 15px;
    }
    .notif-header-actions { display: flex; gap: 6px; align-items: center; }
    .notif-header-btn {
      background: rgba(255,255,255,0.18);
      border: none; color: white;
      border-radius: 8px; padding: 5px 10px;
      font-size: 11.5px; font-weight: 500;
      cursor: pointer; transition: background .15s;
      font-family: inherit;
    }
    .notif-header-btn:hover { background: rgba(255,255,255,0.3); }
    .notif-close-btn {
      background: rgba(255,255,255,0.18);
      border: none; color: white;
      width: 26px; height: 26px; border-radius: 50%;
      cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .notif-close-btn:hover { background: rgba(255,255,255,0.3); transform: rotate(90deg); }
    .notif-list {
      flex: 1; overflow-y: auto; padding: 8px;
      background: var(--bg-alt, #f8fafc);
    }
    .notif-list::-webkit-scrollbar { width: 6px; }
    .notif-list::-webkit-scrollbar-thumb { background: var(--border, #e2e8f0); border-radius: 6px; }
    .notif-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted, #94a3b8);
      font-size: 13px;
    }
    .notif-empty-icon { font-size: 42px; display: block; margin-bottom: 12px; opacity: .5; }
    .notif-item {
      position: relative;
      padding: 13px 15px;
      background: var(--card-bg, #fff);
      border-radius: 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all .18s;
      border: 1px solid transparent;
    }
    .notif-item:hover {
      border-color: var(--primary, #16a34a);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.08);
    }
    .notif-item.unread {
      background: linear-gradient(135deg, rgba(22,163,74,0.08), rgba(22,163,74,0.03));
      border-left: 3px solid var(--primary, #16a34a);
    }
    .notif-item-head {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 8px; margin-bottom: 5px;
    }
    .notif-item-title {
      font-weight: 700; font-size: 13.5px;
      color: var(--text, #0f172a);
      flex: 1; line-height: 1.4;
    }
    .notif-item-time {
      font-size: 11px; color: var(--muted, #94a3b8);
      white-space: nowrap; flex-shrink: 0;
    }
    .notif-item-content {
      font-size: 12.5px; color: var(--muted, #64748b);
      line-height: 1.55; word-wrap: break-word;
      white-space: pre-wrap;
    }
    .notif-item-del {
      position: absolute; top: 8px; right: 8px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(239, 68, 68, 0.1);
      border: none; color: #ef4444;
      font-size: 11px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .notif-item:hover .notif-item-del { display: flex; }
    .notif-item-del:hover { background: #ef4444; color: white; }
    .notif-item-type {
      display: inline-block;
      font-size: 10px; padding: 1px 7px;
      border-radius: 8px; font-weight: 600;
      margin-right: 6px; vertical-align: middle;
    }
    .notif-item-type.info { background: #dbeafe; color: #1e40af; }
    .notif-item-type.success { background: #dcfce7; color: #166534; }
    .notif-item-type.warning { background: #fef3c7; color: #854d0e; }
    .notif-item-type.error { background: #fee2e2; color: #b91c1c; }
    [data-theme="dark"] .notif-item.unread {
      background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(34,197,94,0.04));
    }
    @media (max-width: 480px) {
      .notif-panel {
        top: 12px; right: 12px; left: 12px;
        width: auto; max-width: none;
        max-height: calc(100vh - 24px);
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🌱 GreenBox</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="tools.html" class="active">工具</a></li>
        <li><a href="changelog.html">更新日志</a></li>
        <li id="profile-nav" style="display:none;"><a href="/profile.html">个人中心</a></li>
      </ul>
      <div class="navbar-right">
        <button id="theme-toggle" aria-label="切换主题">🌙</button>
        <button class="notif-btn" id="notifBtn" title="消息中心">
          🔔
          <span class="notif-badge" id="notifBadge"></span>
        </button>
        <div class="user-area" id="userArea"></div>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1>🧰 全部工具</h1>
    <div id="all-tools" class="tool-grid"></div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 GreenBox · 用心制作</p>
    </div>
  </footer>

  <!-- 通知中心 -->
  <div class="notif-panel-overlay" id="notifOverlay"></div>
  <div class="notif-panel" id="notifPanel">
    <div class="notif-header">
      <div class="notif-header-title">
        <span>🔔</span>
        <span>消息中心</span>
      </div>
      <div class="notif-header-actions">
        <button class="notif-header-btn" id="notifReadAllBtn" title="全部标记为已读">全部已读</button>
        <button class="notif-header-btn" id="notifClearBtn" title="清空消息">清空</button>
        <button class="notif-close-btn" id="notifCloseBtn" title="关闭">✕</button>
      </div>
    </div>
    <div class="notif-list" id="notifList">
      <div class="notif-empty">
        <span class="notif-empty-icon">📭</span>
        <div>加载中...</div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // ============================================================
    //  工具列表加载
    // ============================================================
    (async function() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        const container = document.getElementById('all-tools');
        if (data.tools && data.tools.length > 0) {
          container.innerHTML = data.tools.map(t => `
            <a href="${t.url}" class="tool-card" target="_blank" rel="noopener">
              <span class="tool-icon">${t.icon}</span>
              <h3>${t.name}</h3>
              <p>${t.description}</p>
            </a>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center;padding:3rem 0;color:#94a3b8;">暂无工具，请前往后台添加 ✨</p>';
        }
      } catch (err) {
        console.error('加载数据失败:', err);
        document.getElementById('all-tools').innerHTML = '<p style="text-align:center;padding:3rem 0;color:#ef4444;">加载失败，请稍后重试</p>';
      }
    })();

    // ============================================================
    //  用户认证 + 导航栏
    // ============================================================
    async function checkAuth() {
      const token = localStorage.getItem('greenbox_token');
      if (!token) return null;
      try {
        const res = await fetch('/api/verify', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.valid) return data;
        localStorage.removeItem('greenbox_token');
        localStorage.removeItem('greenbox_user');
        return null;
      } catch (e) { return null; }
    }

    async function renderUserArea() {
      const userArea = document.getElementById('userArea');
      const profileNav = document.getElementById('profile-nav');
      const notifBtn = document.getElementById('notifBtn');
      const user = await checkAuth();
      if (user) {
        const avatarUrl = `/api/user/avatar/${encodeURIComponent(user.username)}?t=` + Date.now();
        const avatarHtml = user.hasAvatar
          ? `<img class="user-avatar-mini" src="${avatarUrl}" alt="" onerror="this.style.display='none'">`
          : '';
        userArea.innerHTML = `
          ${avatarHtml}
          <a href="/profile.html" class="user-name" style="text-decoration:none;color:inherit;" title="个人中心">${user.displayName || user.username}</a>
          <button onclick="logout()" class="btn-outline">退出</button>
        `;
        if (profileNav) profileNav.style.display = 'list-item';
        if (notifBtn) notifBtn.style.display = 'flex';
        updateUnreadCount();
      } else {
        userArea.innerHTML = `
          <a href="/login.html" class="btn-primary-sm">登录</a>
          <a href="/register.html" class="btn-outline">注册</a>
        `;
        if (profileNav) profileNav.style.display = 'none';
        if (notifBtn) notifBtn.style.display = 'none';
      }
    }

    window.logout = function() {
      const token = localStorage.getItem('greenbox_token');
      if (token) fetch('/api/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
      localStorage.removeItem('greenbox_token');
      localStorage.removeItem('greenbox_user');
      location.reload();
    };

    // ============================================================
    //  通知中心
    // ============================================================
    (function() {
      const notifBtn = document.getElementById('notifBtn');
      const badge = document.getElementById('notifBadge');
      const panel = document.getElementById('notifPanel');
      const overlay = document.getElementById('notifOverlay');
      const listEl = document.getElementById('notifList');
      const closeBtn = document.getElementById('notifCloseBtn');
      const readAllBtn = document.getElementById('notifReadAllBtn');
      const clearBtn = document.getElementById('notifClearBtn');

      if (!notifBtn) return;

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function timeAgo(ts) {
        const d = Date.now() - ts;
        if (d < 60000) return '刚刚';
        if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
        if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
        if (d < 604800000) return Math.floor(d / 86400000) + ' 天前';
        const date = new Date(ts);
        return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
      }

      async function updateUnreadCount() {
        const token = localStorage.getItem('greenbox_token');
        if (!token) { badge.classList.remove('show'); return; }
        try {
          const res = await fetch('/api/notifications/unread-count', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data.count > 0) {
            badge.textContent = data.count > 99 ? '99+' : data.count;
            badge.classList.add('show');
          } else {
            badge.classList.remove('show');
          }
        } catch (e) {}
      }
      window.updateUnreadCount = updateUnreadCount;

      async function loadNotifications() {
        const token = localStorage.getItem('greenbox_token');
        if (!token) {
          listEl.innerHTML = '<div class="notif-empty"><span class="notif-empty-icon">🔐</span><div>请先登录</div></div>';
          return;
        }
        listEl.innerHTML = '<div class="notif-empty"><span class="notif-empty-icon">📭</span><div>加载中...</div></div>';
        try {
          const res = await fetch('/api/notifications', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (!res.ok) throw new Error('加载失败');
          const list = await res.json();
          renderNotifications(list);
        } catch (e) {
          listEl.innerHTML = `<div class="notif-empty"><span class="notif-empty-icon">⚠️</span><div>加载失败</div></div>`;
        }
      }

      function renderNotifications(list) {
        if (!list || list.length === 0) {
          listEl.innerHTML = '<div class="notif-empty"><span class="notif-empty-icon">📭</span><div>暂无消息</div></div>';
          return;
        }
        const typeLabel = { info: '通知', success: '成功', warning: '注意', error: '警告' };
        listEl.innerHTML = list.map(n => `
          <div class="notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}">
            <button class="notif-item-del" data-del="${n.id}" title="删除">✕</button>
            <div class="notif-item-head">
              <div class="notif-item-title">
                <span class="notif-item-type ${n.type}">${typeLabel[n.type] || '通知'}</span>
                ${escapeHtml(n.title)}
              </div>
              <div class="notif-item-time">${timeAgo(n.createdAt)}</div>
            </div>
            <div class="notif-item-content">${escapeHtml(n.content)}</div>
          </div>
        `).join('');

        listEl.querySelectorAll('.notif-item').forEach(item => {
          item.addEventListener('click', async (e) => {
            if (e.target.closest('.notif-item-del')) return;
            const id = item.dataset.id;
            if (item.classList.contains('unread')) {
              item.classList.remove('unread');
              await markRead([id]);
              updateUnreadCount();
            }
          });
        });

        listEl.querySelectorAll('.notif-item-del').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.dataset.del;
            await deleteNotif(id);
            loadNotifications();
            updateUnreadCount();
          });
        });
      }

      async function markRead(ids) {
        const token = localStorage.getItem('greenbox_token');
        if (!token) return;
        try {
          await fetch('/api/notifications/read', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ ids })
          });
        } catch (e) {}
      }

      async function deleteNotif(id) {
        const token = localStorage.getItem('greenbox_token');
        if (!token) return;
        try {
          await fetch(`/api/notifications/${encodeURIComponent(id)}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
        } catch (e) {}
      }

      function openPanel() {
        panel.classList.add('show');
        overlay.classList.add('show');
        loadNotifications();
      }
      function closePanel() {
        panel.classList.remove('show');
        overlay.classList.remove('show');
      }

      notifBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (panel.classList.contains('show')) closePanel();
        else openPanel();
      });
      closeBtn.addEventListener('click', closePanel);
      overlay.addEventListener('click', closePanel);

      readAllBtn.addEventListener('click', async () => {
        const token = localStorage.getItem('greenbox_token');
        if (!token) return;
        try {
          await fetch('/api/notifications/read-all', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          loadNotifications();
          updateUnreadCount();
        } catch (e) {}
      });

      clearBtn.addEventListener('click', async () => {
        if (!confirm('清空所有消息？')) return;
        const token = localStorage.getItem('greenbox_token');
        if (!token) return;
        try {
          await fetch('/api/notifications', {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          loadNotifications();
          updateUnreadCount();
        } catch (e) {}
      });

      setInterval(updateUnreadCount, 30000);
    })();

    renderUserArea();
  </script>
</body>
</html>
