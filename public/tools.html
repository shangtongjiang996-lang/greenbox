<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部工具 · GreenBox</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%2316a34a'/%3E%3Ctext x='50' y='70' font-size='60' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">🌱 GreenBox</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="tools.html" class="active">工具</a></li>
        <li><a href="changelog.html">更新日志</a></li>
      </ul>
      <button id="theme-toggle" aria-label="切换主题">🌙</button>
    </div>
  </nav>

  <main class="container">
    <h1>🧰 全部工具</h1>
    <div id="all-tools" class="tool-grid"></div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 GreenBox · 用心制作</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/data');  // 使用相对路径，指向同域名
        const data = await res.json();
        const container = document.getElementById('all-tools');
        if (data.tools && data.tools.length > 0) {
          container.innerHTML = data.tools.map(t => `
            <a href="${t.url}" class="tool-card" target="_blank" rel="noopener">
              <span class="tool-icon">${t.icon}</span>
              <h3>${t.name}</h3>
              <p>${t.description}</p>
            </a>
          `).join('');
        } else {
          container.innerHTML = '<p style="text-align:center;padding:3rem 0;color:#94a3b8;">暂无工具，请前往后台添加 ✨</p>';
        }
      } catch (err) {
        console.error('加载数据失败:', err);
      }
    })();
  </script>
</body>
</html>
